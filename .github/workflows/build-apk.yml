name: Build DuoMate Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        working-directory: android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/DuoMate.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuoMate-Android-APK
          path: build-output/DuoMate.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DuoMate Android App v1.0.${{ github.run_number }}
          body: |
            ## 📱 DuoMate Android Mobile App (APK)
            **Two Friends. One Goal. Better Every Day.**
            
            Exclusively for Aadhavan & Narmatha.
            
            ### How to install on your phone:
            1. Download the `DuoMate.apk` file attached below directly onto your Android phone.
            2. Tap on the downloaded file.
            3. If prompted, allow "Install from unknown sources" in Settings.
            4. Tap **Install** and launch **DuoMate**!
          files: build-output/DuoMate.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
