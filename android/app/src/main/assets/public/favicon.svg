<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e1a"/>
      <stop offset="50%" stop-color="#14172b"/>
      <stop offset="100%" stop-color="#1e1338"/>
    </linearGradient>

    <!-- Aadhavan Indigo Glow -->
    <radialGradient id="aadhavanGlow" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- Narmatha Purple/Pink Glow -->
    <radialGradient id="narmathaGlow" cx="70%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <!-- Mutual Synergy Center Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ringLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="ringRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border Glow -->
  <rect x="20" y="20" width="472" height="472" rx="110" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="3"/>

  <!-- Ambient Light Orbs -->
  <circle cx="170" cy="170" r="140" fill="url(#aadhavanGlow)"/>
  <circle cx="342" cy="342" r="140" fill="url(#narmathaGlow)"/>
  <circle cx="256" cy="256" r="110" fill="url(#centerGlow)"/>

  <!-- Left Ring: Aadhavan (VLSI / Logic) -->
  <circle cx="205" cy="250" r="75" fill="none" stroke="url(#ringLeft)" stroke-width="18" stroke-linecap="round"/>

  <!-- Right Ring: Narmatha (Digital / Circuits) -->
  <circle cx="307" cy="250" r="75" fill="none" stroke="url(#ringRight)" stroke-width="18" stroke-linecap="round"/>

  <!-- Overlap Intersection Glow -->
  <ellipse cx="256" cy="250" rx="30" ry="46" fill="none" stroke="#ffffff" stroke-width="7" opacity="0.85"/>

  <!-- Circuit nodes -->
  <circle cx="256" cy="155" r="9" fill="#fde047"/>
  <line x1="256" y1="155" x2="205" y2="175" stroke="#ffffff" stroke-width="3" opacity="0.6"/>
  <line x1="256" y1="155" x2="307" y2="175" stroke="#ffffff" stroke-width="3" opacity="0.6"/>

  <circle cx="130" cy="250" r="8" fill="#38bdf8"/>
  <circle cx="382" cy="250" r="8" fill="#f43f5e"/>
  <circle cx="205" cy="325" r="7" fill="#818cf8"/>
  <circle cx="307" cy="325" r="7" fill="#f472b6"/>

  <!-- Monogram DM -->
  <text x="256" y="278" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="78" fill="#ffffff" text-anchor="middle" letter-spacing="-2" filter="drop-shadow(0px 4px 10px rgba(0,0,0,0.6))">DM</text>

  <!-- Tagline -->
  <text x="256" y="390" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="#cbd5e1" text-anchor="middle" letter-spacing="4" opacity="0.9">DUOMATE</text>
</svg>
